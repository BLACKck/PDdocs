<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 游戏设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .settings-container {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-logo {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .setting-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .setting-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .setting-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .setting-value {
            font-size: 14px;
            color: #4CAF50;
            font-weight: bold;
        }

        .setting-description {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 5px 15px rgba(96, 125, 139, 0.3);
        }

        .theme-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .theme-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .theme-option:hover {
            transform: scale(1.1);
        }

        .theme-option.active {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }

        .theme-dark {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .theme-light {
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
        }

        .theme-green {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        @media (max-width: 600px) {
            .settings-container {
                padding: 30px 20px;
            }

            .game-logo {
                font-size: 50px;
            }

            .page-title {
                font-size: 28px;
            }

            .setting-item {
                padding: 15px;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="game-logo">🐍</div>
        <h1 class="page-title">游戏设置</h1>
        <p class="page-subtitle">自定义你的游戏体验</p>

        <div class="settings-options">
            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-name">游戏速度</div>
                    <div class="setting-value" id="speedValue">中</div>
                </div>
                <div class="setting-description">调整蛇的移动速度</div>
                <div class="setting-control">
                    <input type="range" min="1" max="5" value="3" class="slider" id="speedSlider" oninput="updateSpeed(this.value)">
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-name">音效</div>
                    <div class="setting-value" id="soundValue">开启</div>
                </div>
                <div class="setting-description">游戏音效开关</div>
                <div class="setting-control">
                    <label class="toggle">
                        <input type="checkbox" checked onchange="toggleSound(this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-name">震动反馈</div>
                    <div class="setting-value" id="vibrationValue">开启</div>
                </div>
                <div class="setting-description">移动设备震动反馈</div>
                <div class="setting-control">
                    <label class="toggle">
                        <input type="checkbox" checked onchange="toggleVibration(this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-name">游戏主题</div>
                    <div class="setting-value" id="themeValue">深色主题</div>
                </div>
                <div class="setting-description">选择游戏主题</div>
                <div class="theme-options">
                    <div class="theme-option theme-dark active" onclick="selectTheme('dark')"></div>
                    <div class="theme-option theme-light" onclick="selectTheme('light')"></div>
                    <div class="theme-option theme-green" onclick="selectTheme('green')"></div>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-name">显示网格</div>
                    <div class="setting-value" id="gridValue">开启</div>
                </div>
                <div class="setting-description">游戏区域网格显示</div>
                <div class="setting-control">
                    <label class="toggle">
                        <input type="checkbox" checked onchange="toggleGrid(this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-primary" onclick="saveSettings()">
                <span>💾</span>
                保存设置
            </button>
            <button class="btn btn-secondary" onclick="backToMenu()">
                <span>🏠</span>
                返回菜单
            </button>
        </div>
    </div>

    <script>
        function updateSpeed(value) {
            const speedLabels = ['极慢', '慢', '中', '快', '极快'];
            document.getElementById('speedValue').textContent = speedLabels[value - 1];
        }

        function toggleSound(checked) {
            document.getElementById('soundValue').textContent = checked ? '开启' : '关闭';
        }

        function toggleVibration(checked) {
            document.getElementById('vibrationValue').textContent = checked ? '开启' : '关闭';
        }

        function selectTheme(theme) {
            // 移除所有主题选项的active类
            document.querySelectorAll('.theme-option').forEach(option => {
                option.classList.remove('active');
            });
            
            // 添加active类到选中的主题
            document.querySelector(`.theme-${theme}`).classList.add('active');
            
            const themeLabels = {
                'dark': '深色主题',
                'light': '浅色主题',
                'green': '绿色主题'
            };
            document.getElementById('themeValue').textContent = themeLabels[theme];
        }

        function toggleGrid(checked) {
            document.getElementById('gridValue').textContent = checked ? '开启' : '关闭';
        }

        function saveSettings() {
            console.log('保存设置');
            alert('设置已保存！');
        }

        function backToMenu() {
            window.location.href = 'index.html';
        }

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                backToMenu();
            }
        });
    </script>
</body>
</html>
