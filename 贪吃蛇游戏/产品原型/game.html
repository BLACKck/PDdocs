<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 游戏界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .game-stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
        }

        .game-area {
            position: relative;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 400px;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-pause {
            background: linear-gradient(135deg, #FF9800, #f57c00);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-resume {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #F44336, #d32f2f);
            color: white;
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .btn-back {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 5px 15px rgba(96, 125, 139, 0.3);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-width: 300px;
            width: 100%;
        }

        .mobile-btn {
            padding: 20px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        .btn-down {
            grid-column: 2;
            grid-row: 3;
        }

        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #0f3460, #16213e);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .modal-btn.cancel {
            background: linear-gradient(135deg, #607D8B, #455A64);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            .game-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .game-stats {
                justify-content: center;
            }

            #gameCanvas {
                height: 300px;
            }

            .game-controls {
                flex-wrap: wrap;
            }

            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🐍 贪吃蛇游戏</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-value" id="score">0</div>
                    <div class="stat-label">分数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="level">1</div>
                    <div class="stat-label">关卡</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lives">3</div>
                    <div class="stat-label">生命</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="time">00:00</div>
                    <div class="stat-label">时间</div>
                </div>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="760" height="400"></canvas>
        </div>

        <div class="game-controls">
            <button class="control-btn btn-pause" onclick="pauseGame()">
                ⏸️ 暂停
            </button>
            <button class="control-btn btn-restart" onclick="restartGame()">
                🔄 重新开始
            </button>
            <button class="control-btn btn-back" onclick="backToMenu()">
                🏠 返回菜单
            </button>
        </div>

        <div class="mobile-controls">
            <button class="mobile-btn btn-up" onclick="moveUp()">↑</button>
            <button class="mobile-btn btn-left" onclick="moveLeft()">←</button>
            <button class="mobile-btn btn-down" onclick="moveDown()">↓</button>
            <button class="mobile-btn btn-right" onclick="moveRight()">→</button>
        </div>
    </div>

    <div class="modal" id="pauseModal">
        <div class="modal-content">
            <h2 class="modal-title">⏸️ 游戏暂停</h2>
            <div class="modal-message">
                <p>游戏已暂停</p>
                <p>按继续按钮恢复游戏</p>
            </div>
            <div>
                <button class="modal-btn" onclick="resumeGame()">继续游戏</button>
                <button class="modal-btn cancel" onclick="backToMenu()">返回菜单</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;
        
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameInterval;
        let score = 0;
        let level = 1;
        let lives = 3;
        let time = 0;
        let isPaused = false;
        let gameSpeed = 150;
        
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            level = 1;
            lives = 3;
            time = 0;
            isPaused = false;
            gameSpeed = 150;
            
            updateScore();
            generateFood();
            draw();
            startGameLoop();
        }
        
        function startGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
            
            setInterval(() => {
                if (!isPaused) {
                    time++;
                    updateTime();
                }
            }, 1000);
        }
        
        function gameLoop() {
            if (isPaused) return;
            
            direction = nextDirection;
            moveSnake();
            checkCollision();
            draw();
        }
        
        function moveSnake() {
            const head = { ...snake[0] };
            
            switch (direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10 * level;
                updateScore();
                generateFood();
                
                if (score > 0 && score % 100 === 0) {
                    level++;
                    gameSpeed = Math.max(50, 150 - (level - 1) * 20);
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }
        
        function checkCollision() {
            const head = snake[0];
            
            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                gameOver();
                return;
            }
            
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
        }
        
        function generateFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * tileCountX),
                    y: Math.floor(Math.random() * tileCountY)
                };
                
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= canvas.height; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                
                if (index === 0) {
                    drawSnakeHead(x, y);
                } else if (index === snake.length - 1) {
                    drawSnakeTail(x, y, index);
                } else {
                    drawSnakeBody(x, y, index);
                }
            });
            
            drawFood();
        }
        
        function drawSnakeHead(x, y) {
            const centerX = x + gridSize / 2;
            const centerY = y + gridSize / 2;
            
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(centerX, centerY, gridSize / 2 - 1, 0, Math.PI * 2);
            ctx.fill();
            
            const eyeSize = gridSize / 6;
            const eyeOffset = gridSize / 4;
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(centerX + eyeOffset, centerY - eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.arc(centerX + eyeOffset, centerY + eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#F44336';
            ctx.beginPath();
            ctx.arc(centerX + gridSize / 2, centerY, gridSize / 8, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawSnakeBody(x, y, index) {
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
            ctx.fill();
            
            if (index % 2 === 0) {
                ctx.fillStyle = '#FFC107';
                ctx.beginPath();
                ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawSnakeTail(x, y, index) {
            ctx.fillStyle = '#388E3C';
            ctx.beginPath();
            ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawFood() {
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            
            ctx.fillStyle = '#FFC107';
            ctx.beginPath();
            ctx.arc(centerX, centerY, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
        }
        
        function updateTime() {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            document.getElementById('time').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function pauseGame() {
            isPaused = true;
            document.getElementById('pauseModal').classList.add('show');
        }
        
        function resumeGame() {
            isPaused = false;
            document.getElementById('pauseModal').classList.remove('show');
        }
        
        function restartGame() {
            if (confirm('确定要重新开始游戏吗？')) {
                clearInterval(gameInterval);
                initGame();
            }
        }
        
        function backToMenu() {
            if (confirm('确定要返回主菜单吗？当前游戏进度将丢失。')) {
                clearInterval(gameInterval);
                window.location.href = 'index.html';
            }
        }
        
        function gameOver() {
            clearInterval(gameInterval);
            lives--;
            
            if (lives > 0) {
                updateScore();
                alert(`游戏结束！剩余生命：${lives}`);
                initGame();
            } else {
                window.location.href = 'game-over.html';
            }
        }
        
        function moveUp() {
            if (direction !== 'down') {
                nextDirection = 'up';
            }
        }
        
        function moveLeft() {
            if (direction !== 'right') {
                nextDirection = 'left';
            }
        }
        
        function moveDown() {
            if (direction !== 'up') {
                nextDirection = 'down';
            }
        }
        
        function moveRight() {
            if (direction !== 'left') {
                nextDirection = 'right';
            }
        }
        
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowUp':
                    moveUp();
                    break;
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case ' ':
                    if (isPaused) {
                        resumeGame();
                    } else {
                        pauseGame();
                    }
                    break;
            }
        });
        
        window.onload = initGame;
    </script>
</body>
</html>
