<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 选择难度</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .difficulty-container {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-logo {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .difficulty-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .difficulty-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: left;
        }

        .difficulty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: #4CAF50;
        }

        .difficulty-card.active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .difficulty-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .difficulty-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .difficulty-icon {
            font-size: 24px;
        }

        .difficulty-description {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .difficulty-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #888;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 5px 15px rgba(96, 125, 139, 0.3);
        }

        .easy {
            border-left: 4px solid #4CAF50;
        }

        .medium {
            border-left: 4px solid #FF9800;
        }

        .hard {
            border-left: 4px solid #F44336;
        }

        .expert {
            border-left: 4px solid #9C27B0;
        }

        @media (max-width: 600px) {
            .difficulty-container {
                padding: 30px 20px;
            }

            .game-logo {
                font-size: 50px;
            }

            .page-title {
                font-size: 28px;
            }

            .difficulty-card {
                padding: 20px;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="difficulty-container">
        <div class="game-logo">🐍</div>
        <h1 class="page-title">选择难度</h1>
        <p class="page-subtitle">选择适合你的游戏难度</p>

        <div class="difficulty-options">
            <div class="difficulty-card easy" onclick="selectDifficulty('easy')">
                <div class="difficulty-header">
                    <div class="difficulty-name">简单</div>
                    <div class="difficulty-icon">🐣</div>
                </div>
                <div class="difficulty-description">适合初学者，速度较慢，容错率高</div>
                <div class="difficulty-stats">
                    <div class="stat">🐢 速度: 慢</div>
                    <div class="stat">❤️ 生命: 5</div>
                    <div class="stat">🏆 分数: 1x</div>
                </div>
            </div>

            <div class="difficulty-card medium active" onclick="selectDifficulty('medium')">
                <div class="difficulty-header">
                    <div class="difficulty-name">普通</div>
                    <div class="difficulty-icon">🐍</div>
                </div>
                <div class="difficulty-description">适合大多数玩家，平衡的速度和难度</div>
                <div class="difficulty-stats">
                    <div class="stat">🐇 速度: 中</div>
                    <div class="stat">❤️ 生命: 3</div>
                    <div class="stat">🏆 分数: 2x</div>
                </div>
            </div>

            <div class="difficulty-card hard" onclick="selectDifficulty('hard')">
                <div class="difficulty-header">
                    <div class="difficulty-name">困难</div>
                    <div class="difficulty-icon">🐎</div>
                </div>
                <div class="difficulty-description">适合有经验的玩家，速度较快，挑战较大</div>
                <div class="difficulty-stats">
                    <div class="stat">🐆 速度: 快</div>
                    <div class="stat">❤️ 生命: 2</div>
                    <div class="stat">🏆 分数: 3x</div>
                </div>
            </div>

            <div class="difficulty-card expert" onclick="selectDifficulty('expert')">
                <div class="difficulty-header">
                    <div class="difficulty-name">专家</div>
                    <div class="difficulty-icon">🦅</div>
                </div>
                <div class="difficulty-description">适合高手，速度极快，几乎没有容错空间</div>
                <div class="difficulty-stats">
                    <div class="stat">⚡ 速度: 极快</div>
                    <div class="stat">❤️ 生命: 1</div>
                    <div class="stat">🏆 分数: 5x</div>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-primary" onclick="startGame()">
                <span>▶️</span>
                开始游戏
            </button>
            <button class="btn btn-secondary" onclick="backToMenu()">
                <span>🏠</span>
                返回菜单
            </button>
        </div>
    </div>

    <script>
        let selectedDifficulty = 'medium';

        function selectDifficulty(difficulty) {
            selectedDifficulty = difficulty;
            
            // 移除所有卡片的active类
            document.querySelectorAll('.difficulty-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // 添加active类到选中的卡片
            document.querySelector(`.${difficulty}`).classList.add('active');
        }

        function startGame() {
            console.log(`开始游戏，难度: ${selectedDifficulty}`);
            // 跳转到游戏界面
            window.location.href = 'game.html';
        }

        function backToMenu() {
            window.location.href = 'index.html';
        }

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                backToMenu();
            }
            if (e.key === 'Enter') {
                startGame();
            }
        });
    </script>
</body>
</html>
