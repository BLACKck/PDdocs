<body class="bg-gray-50 min-h-screen">

                    <a href="店端管理系统-配件信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm z-10">
                <div class="flex justify-between items-center h-16 px-6">
                    <div class="flex items-center">
                        <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fa fa-bell text-xl"></i>
                                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500"></span>
                            </button>
                        </div>
                        <div class="relative">
                            <button type="button" class="flex items-center text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md px-3 py-2">
                                <i class="fa fa-user-circle text-lg mr-2"></i>
                                <span>管理员</span>
                                <i class="fa fa-caret-down ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <h2 class="text-2xl font-bold text-dark mb-6">预约管理</h2>

                <!-- 预约状态筛选 -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-wrap items-center gap-4">
                        <span class="text-sm font-medium text-gray-700">状态筛选：</span>
                        <button class="px-3 py-1 rounded-full bg-primary text-white text-sm">全部</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">待确认</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">已确认</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">维修中</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">已完成</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">已取消</button>
                    </div>
                </div>

                <!-- 预约列表 -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">预约编号</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">客户</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">车辆</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">预约时间</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">维修类型</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <!-- 预约记录 1 -->
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">20260301001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">张三</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京A12345 - 大众 帕萨特</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2026-03-05 14:00</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">常规保养</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">待确认</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80 mr-3">确认</a>
                                        <a href="#" class="text-danger hover:text-danger/80">拒绝</a>
                                    </td>
                                </tr>
                                <!-- 预约记录 2 -->
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">20260228001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">李四</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京B67890 - 丰田 卡罗拉</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2026-03-01 10:00</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">故障维修</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">维修中</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80">查看</a>
                                    </td>
                                </tr>
                                <!-- 预约记录 3 -->
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">20260225001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">王五</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京C12345 - 宝马 3系</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2026-02-28 09:00</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">车辆检测</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">已完成</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80">查看</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 分页 -->
                    <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                        <div class="text-sm text-gray-700">

                        </div>
                        <div class="flex space-x-2">
                            <button class="px-3 py-1 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50" disabled>
                                上一页
                            </button>
                            <button class="px-3 py-1 border border-primary bg-primary text-white rounded-md">
                                1
                            </button>
                            <button class="px-3 py-1 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50" disabled>
                                下一页
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 状态筛选按钮点击事件
        document.querySelectorAll('button[class*="rounded-full"]').forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有按钮的选中状态
                document.querySelectorAll('button[class*="rounded-full"]').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                });
                // 设置当前按钮为选中状态
                this.classList.remove('bg-gray-200', 'text-gray-700');
                this.classList.add('bg-primary', 'text-white');
                // 模拟筛选效果
                alert('筛选状态：' + this.textContent.trim());
            });
        });
        
        // 确认和拒绝按钮功能
        document.querySelectorAll('a[href="#"].text-primary').forEach(link => {
            if (link.textContent.trim() === '确认') {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('预约已确认');
                    // 刷新页面
                    window.location.reload();
                });
            } else if (link.textContent.trim() === '查看') {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('查看预约详情');
                });
            }
        });
        
        document.querySelectorAll('a[href="#"].text-danger').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('确定要拒绝这个预约吗？')) {
                    alert('预约已拒绝');
                    // 刷新页面
                    window.location.reload();
                }
            });
        });
    </script>
</body>
