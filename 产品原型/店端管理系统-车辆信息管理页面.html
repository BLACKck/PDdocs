<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆预约维修系统 - 车辆信息管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f59e0b',
                        success: '#10b981',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 侧边导航栏 -->
    <div class="flex h-screen overflow-hidden">
        <div class="bg-dark w-64 flex-shrink-0">
            <div class="flex items-center justify-center h-16 border-b border-gray-700">
                <h1 class="text-xl font-bold text-white">店端管理系统</h1>
            </div>
            <div class="mt-6">
                <nav class="px-2">
                    <a href="店端管理系统-首页.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-dashboard w-6"></i>
                        <span class="ml-3">仪表盘</span>
                    </a>
                    <a href="店端管理系统-客户信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-users w-6"></i>
                        <span class="ml-3">客户管理</span>
                    </a>
                    <a href="店端管理系统-车辆信息管理页面.html" class="flex items-center px-4 py-3 text-white bg-primary/20 rounded-md mb-1">
                        <i class="fa fa-car w-6"></i>
                        <span class="ml-3">车辆管理</span>
                    </a>
                    <a href="店端管理系统-配件信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-cubes w-6"></i>
                        <span class="ml-3">配件管理</span>
                    </a>
                    <a href="店端管理系统-预约管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-calendar w-6"></i>
                        <span class="ml-3">预约管理</span>
                    </a>
                    <a href="店端管理系统-维修流程管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-wrench w-6"></i>
                        <span class="ml-3">维修管理</span>
                    </a>
                    <a href="店端管理系统-财务管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-money w-6"></i>
                        <span class="ml-3">财务管理</span>
                    </a>
                    <a href="店端管理系统-数据分析页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-bar-chart w-6"></i>
                        <span class="ml-3">数据分析</span>
                    </a>
                    <a href="店端管理系统-系统管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-cog w-6"></i>
                        <span class="ml-3">系统设置</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm z-10">
                <div class="flex justify-between items-center h-16 px-6">
                    <div class="flex items-center">
                        <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fa fa-bell text-xl"></i>
                                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500"></span>
                            </button>
                        </div>
                        <div class="relative">
                            <button type="button" class="flex items-center text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md px-3 py-2">
                                <i class="fa fa-user-circle text-lg mr-2"></i>
                                <span>管理员</span>
                                <i class="fa fa-caret-down ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-dark">车辆信息管理</h2>
                    <button id="add-vehicle-btn" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-md transition-colors duration-200">
                        <i class="fa fa-plus mr-2"></i>添加车辆
                    </button>
                </div>

                <!-- 搜索和筛选 -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex-1 min-w-[200px]">
                            <input type="text" placeholder="搜索车牌号或VIN码" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <select class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">选择客户</option>
                                <option value="1">张三</option>
                                <option value="2">李四</option>
                                <option value="3">王五</option>
                            </select>
                        </div>
                        <div>
                            <button class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-md transition-colors duration-200">
                                <i class="fa fa-search mr-2"></i>查询
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 车辆列表 -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">车辆ID</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">车牌号</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">VIN码</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">品牌/型号</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">所属客户</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">行驶里程</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">V001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京A12345</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">LSVCD2A4XEN000001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">大众 帕萨特</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">张三</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">56,000 km</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80 mr-3">编辑</a>
                                        <a href="#" class="text-danger hover:text-danger/80">删除</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">V002</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京B67890</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">LFMA1234567890123</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">丰田 卡罗拉</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">李四</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">32,000 km</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80 mr-3">编辑</a>
                                        <a href="#" class="text-danger hover:text-danger/80">删除</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">V003</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">京C12345</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">WBA3A5100J5D00001</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">宝马 3系</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">王五</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">45,000 km</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        <a href="#" class="text-primary hover:text-primary/80 mr-3">编辑</a>
                                        <a href="#" class="text-danger hover:text-danger/80">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 分页 -->
                    <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                        <div class="text-sm text-gray-700">
                            显示 1 至 3 条，共 3 条记录
                        </div>
                        <div class="flex space-x-2">
                            <button class="px-3 py-1 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50" disabled>
                                上一页
                            </button>
                            <button class="px-3 py-1 border border-primary bg-primary text-white rounded-md">
                                1
                            </button>
                            <button class="px-3 py-1 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50" disabled>
                                下一页
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加车辆模态框 -->
    <div id="add-vehicle-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-dark">添加车辆</h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-500">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <form id="add-vehicle-form" class="space-y-4">
                <div>
                    <label for="customer" class="block text-sm font-medium text-gray-700 mb-1">所属客户</label>
                    <select id="customer" name="customer" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                        <option value="">请选择客户</option>
                        <option value="1">张三</option>
                        <option value="2">李四</option>
                        <option value="3">王五</option>
                    </select>
                </div>
                <div>
                    <label for="license-plate" class="block text-sm font-medium text-gray-700 mb-1">车牌号</label>
                    <input type="text" id="license-plate" name="license-plate" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div>
                    <label for="vin" class="block text-sm font-medium text-gray-700 mb-1">VIN码</label>
                    <input type="text" id="vin" name="vin" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div>
                    <label for="brand" class="block text-sm font-medium text-gray-700 mb-1">品牌</label>
                    <input type="text" id="brand" name="brand" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div>
                    <label for="model" class="block text-sm font-medium text-gray-700 mb-1">型号</label>
                    <input type="text" id="model" name="model" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div>
                    <label for="mileage" class="block text-sm font-medium text-gray-700 mb-1">行驶里程（km）</label>
                    <input type="number" id="mileage" name="mileage" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-add" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors duration-200">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-md transition-colors duration-200">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 打开添加车辆模态框
        document.getElementById('add-vehicle-btn').addEventListener('click', function() {
            document.getElementById('add-vehicle-modal').classList.remove('hidden');
        });
        
        // 关闭模态框
        document.getElementById('close-modal').addEventListener('click', function() {
            document.getElementById('add-vehicle-modal').classList.add('hidden');
        });
        
        document.getElementById('cancel-add').addEventListener('click', function() {
            document.getElementById('add-vehicle-modal').classList.add('hidden');
        });
        
        // 提交添加车辆表单
        document.getElementById('add-vehicle-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 模拟表单提交
            alert('车辆添加成功！');
            // 关闭模态框
            document.getElementById('add-vehicle-modal').classList.add('hidden');
            // 刷新页面
            window.location.reload();
        });
        
        // 编辑和删除按钮功能
        document.querySelectorAll('a[href="#"].text-primary').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                alert('编辑车辆信息');
            });
        });
        
        document.querySelectorAll('a[href="#"].text-danger').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('确定要删除这辆车吗？')) {
                    alert('车辆删除成功！');
                    // 刷新页面
                    window.location.reload();
                }
            });
        });
    </script>
</body>
</html>
