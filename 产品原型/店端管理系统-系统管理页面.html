<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆预约维修系统 - 系统管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f59e0b',
                        success: '#10b981',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 侧边导航栏 -->
    <div class="flex h-screen overflow-hidden">
        <div class="bg-dark w-64 flex-shrink-0">
            <div class="flex items-center justify-center h-16 border-b border-gray-700">
                <h1 class="text-xl font-bold text-white">店端管理系统</h1>
            </div>
            <div class="mt-6">
                <nav class="px-2">
                    <a href="店端管理系统-首页.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-dashboard w-6"></i>
                        <span class="ml-3">仪表盘</span>
                    </a>
                    <a href="店端管理系统-客户信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-users w-6"></i>
                        <span class="ml-3">客户管理</span>
                    </a>
                    <a href="店端管理系统-车辆信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-car w-6"></i>
                        <span class="ml-3">车辆管理</span>
                    </a>
                    <a href="店端管理系统-配件信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-cubes w-6"></i>
                        <span class="ml-3">配件管理</span>
                    </a>
                    <a href="店端管理系统-预约管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-calendar w-6"></i>
                        <span class="ml-3">预约管理</span>
                    </a>
                    <a href="店端管理系统-维修流程管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-wrench w-6"></i>
                        <span class="ml-3">维修管理</span>
                    </a>
                    <a href="店端管理系统-财务管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-money w-6"></i>
                        <span class="ml-3">财务管理</span>
                    </a>
                    <a href="店端管理系统-数据分析页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-bar-chart w-6"></i>
                        <span class="ml-3">数据分析</span>
                    </a>
                    <a href="店端管理系统-系统管理页面.html" class="flex items-center px-4 py-3 text-white bg-primary/20 rounded-md mb-1">
                        <i class="fa fa-cog w-6"></i>
                        <span class="ml-3">系统设置</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm z-10">
                <div class="flex justify-between items-center h-16 px-6">
                    <div class="flex items-center">
                        <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fa fa-bell text-xl"></i>
                                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500"></span>
                            </button>
                        </div>
                        <div class="relative">
                            <button type="button" class="flex items-center text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md px-3 py-2">
                                <i class="fa fa-user-circle text-lg mr-2"></i>
                                <span>管理员</span>
                                <i class="fa fa-caret-down ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <h2 class="text-2xl font-bold text-dark mb-6">系统管理</h2>

                <!-- 系统设置选项卡 -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="border-b border-gray-200">
                        <nav class="-mb-px flex space-x-8">
                            <a href="#" class="border-primary text-primary whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                                基本设置
                            </a>
                            <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                                用户管理
                            </a>
                            <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                                权限管理
                            </a>
                            <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                                系统日志
                            </a>
                        </nav>
                    </div>
                    <div class="p-6">
                        <h3 class="text-lg font-medium text-dark mb-4">基本设置</h3>
                        <form class="space-y-6">
                            <div>
                                <label for="store-name" class="block text-sm font-medium text-gray-700 mb-1">门店名称</label>
                                <input type="text" id="store-name" name="store-name" value="北京朝阳区门店" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label for="store-address" class="block text-sm font-medium text-gray-700 mb-1">门店地址</label>
                                <input type="text" id="store-address" name="store-address" value="北京市朝阳区建国路88号" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label for="store-phone" class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
                                <input type="tel" id="store-phone" name="store-phone" value="010-12345678" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label for="store-hours" class="block text-sm font-medium text-gray-700 mb-1">营业时间</label>
                                <input type="text" id="store-hours" name="store-hours" value="周一至周日 09:00-18:00" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div class="flex justify-end space-x-4">
                                <button type="button" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors duration-200">
                                    取消
                                </button>
                                <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-md transition-colors duration-200">
                                    保存设置
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 系统信息 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mt-6">
                    <h3 class="text-lg font-medium text-dark mb-4">系统信息</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-600">系统版本</span>
                            <span class="text-sm text-gray-900">v1.0.0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-600">最后更新</span>
                            <span class="text-sm text-gray-900">2026-03-01</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-600">服务器状态</span>
                            <span class="text-sm text-success">运行正常</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-600">数据库状态</span>
                            <span class="text-sm text-success">连接正常</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 选项卡点击事件
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                // 移除所有选项卡的选中状态
                document.querySelectorAll('nav a').forEach(navLink => {
                    navLink.classList.remove('border-primary', 'text-primary');
                    navLink.classList.add('border-transparent', 'text-gray-500');
                });
                // 设置当前选项卡为选中状态
                this.classList.remove('border-transparent', 'text-gray-500');
                this.classList.add('border-primary', 'text-primary');
                // 模拟选项卡切换
                alert('切换到：' + this.textContent.trim());
            });
        });
        
        // 保存设置按钮点击事件
        document.querySelector('button[type="submit"]').addEventListener('click', function(e) {
            e.preventDefault();
            alert('设置保存成功！');
        });
        
        // 取消按钮点击事件
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            alert('取消设置');
        });
    </script>
</body>
</html>
