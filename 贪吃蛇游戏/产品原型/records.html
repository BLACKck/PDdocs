<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .records-container {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-logo {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .tab-container {
            display: flex;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: #aaa;
        }

        .tab.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .records-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .record-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .record-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .record-rank {
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
            min-width: 40px;
            text-align: center;
        }

        .rank-1 {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .rank-2 {
            color: #C0C0C0;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.5);
        }

        .rank-3 {
            color: #CD7F32;
            text-shadow: 0 0 10px rgba(205, 127, 50, 0.5);
        }

        .rank-other {
            color: #4CAF50;
        }

        .record-info {
            flex: 1;
            text-align: left;
        }

        .record-player {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .record-details {
            font-size: 12px;
            color: #aaa;
        }

        .record-score {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            min-width: 80px;
            text-align: right;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 5px 15px rgba(96, 125, 139, 0.3);
        }

        .empty-state {
            padding: 60px 20px;
            color: #aaa;
            font-size: 16px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .records-container {
                padding: 30px 20px;
            }

            .game-logo {
                font-size: 50px;
            }

            .page-title {
                font-size: 28px;
            }

            .record-item {
                padding: 12px;
            }

            .record-rank {
                font-size: 20px;
                min-width: 30px;
            }

            .record-score {
                font-size: 20px;
                min-width: 70px;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="records-container">
        <div class="game-logo">🐍</div>
        <h1 class="page-title">排行榜</h1>
        <p class="page-subtitle">查看你的最佳成绩</p>

        <div class="tab-container">
            <div class="tab active" onclick="switchTab('local')">本地记录</div>
            <div class="tab" onclick="switchTab('online')">在线排行榜</div>
        </div>

        <ul class="records-list" id="recordsList">
            <!-- 记录将通过JavaScript动态生成 -->
        </ul>

        <div class="btn-container">
            <button class="btn btn-primary" onclick="clearRecords()">
                <span>🗑️</span>
                清空记录
            </button>
            <button class="btn btn-secondary" onclick="backToMenu()">
                <span>🏠</span>
                返回菜单
            </button>
        </div>
    </div>

    <script>
        const localRecords = [
            { rank: 1, player: '玩家1', score: 520, level: 5, time: '05:32', date: '2026-03-29' },
            { rank: 2, player: '玩家1', score: 380, level: 4, time: '04:15', date: '2026-03-28' },
            { rank: 3, player: '玩家1', score: 250, level: 3, time: '03:20', date: '2026-03-27' },
            { rank: 4, player: '玩家1', score: 180, level: 2, time: '02:45', date: '2026-03-26' },
            { rank: 5, player: '玩家1', score: 120, level: 2, time: '02:10', date: '2026-03-25' },
            { rank: 6, player: '玩家1', score: 95, level: 1, time: '01:45', date: '2026-03-24' },
            { rank: 7, player: '玩家1', score: 75, level: 1, time: '01:30', date: '2026-03-23' }
        ];

        const onlineRecords = [
            { rank: 1, player: 'SnakeMaster', score: 980, level: 10, time: '10:15', date: '2026-03-29' },
            { rank: 2, player: 'ProGamer', score: 850, level: 9, time: '09:30', date: '2026-03-28' },
            { rank: 3, player: 'SnakeKing', score: 720, level: 8, time: '08:45', date: '2026-03-27' },
            { rank: 4, player: 'GamingGod', score: 650, level: 7, time: '07:20', date: '2026-03-26' },
            { rank: 5, player: 'SnakeQueen', score: 580, level: 6, time: '06:50', date: '2026-03-25' }
        ];

        let currentTab = 'local';

        function switchTab(tab) {
            currentTab = tab;
            
            // 更新标签状态
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            
            // 渲染记录
            renderRecords();
        }

        function renderRecords() {
            const recordsList = document.getElementById('recordsList');
            const records = currentTab === 'local' ? localRecords : onlineRecords;
            
            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏆</div>
                        <p>暂无记录</p>
                        <p>开始游戏创造新记录吧！</p>
                    </div>
                `;
                return;
            }
            
            recordsList.innerHTML = records.map(record => {
                let rankClass;
                if (record.rank === 1) rankClass = 'rank-1';
                else if (record.rank === 2) rankClass = 'rank-2';
                else if (record.rank === 3) rankClass = 'rank-3';
                else rankClass = 'rank-other';
                
                return `
                    <li class="record-item">
                        <span class="record-rank ${rankClass}">#${record.rank}</span>
                        <div class="record-info">
                            <div class="record-player">${record.player}</div>
                            <div class="record-details">关卡: ${record.level} | 时间: ${record.time} | ${record.date}</div>
                        </div>
                        <span class="record-score">${record.score}</span>
                    </li>
                `;
            }).join('');
        }

        function clearRecords() {
            if (currentTab === 'local') {
                if (confirm('确定要清空本地记录吗？')) {
                    localRecords.length = 0;
                    renderRecords();
                    alert('本地记录已清空');
                }
            } else {
                alert('无法清空在线排行榜记录');
            }
        }

        function backToMenu() {
            window.location.href = 'index.html';
        }

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                backToMenu();
            }
        });

        // 初始化渲染
        renderRecords();
    </script>
</body>
</html>
