<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆预约维修系统 - 数据分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f59e0b',
                        success: '#10b981',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 侧边导航栏 -->
    <div class="flex h-screen overflow-hidden">
        <div class="bg-dark w-64 flex-shrink-0">
            <div class="flex items-center justify-center h-16 border-b border-gray-700">
                <h1 class="text-xl font-bold text-white">店端管理系统</h1>
            </div>
            <div class="mt-6">
                <nav class="px-2">
                    <a href="店端管理系统-首页.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-dashboard w-6"></i>
                        <span class="ml-3">仪表盘</span>
                    </a>
                    <a href="店端管理系统-客户信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-users w-6"></i>
                        <span class="ml-3">客户管理</span>
                    </a>
                    <a href="店端管理系统-车辆信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-car w-6"></i>
                        <span class="ml-3">车辆管理</span>
                    </a>
                    <a href="店端管理系统-配件信息管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-cubes w-6"></i>
                        <span class="ml-3">配件管理</span>
                    </a>
                    <a href="店端管理系统-预约管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-calendar w-6"></i>
                        <span class="ml-3">预约管理</span>
                    </a>
                    <a href="店端管理系统-维修流程管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-wrench w-6"></i>
                        <span class="ml-3">维修管理</span>
                    </a>
                    <a href="店端管理系统-财务管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-money w-6"></i>
                        <span class="ml-3">财务管理</span>
                    </a>
                    <a href="店端管理系统-数据分析页面.html" class="flex items-center px-4 py-3 text-white bg-primary/20 rounded-md mb-1">
                        <i class="fa fa-bar-chart w-6"></i>
                        <span class="ml-3">数据分析</span>
                    </a>
                    <a href="店端管理系统-系统管理页面.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md mb-1">
                        <i class="fa fa-cog w-6"></i>
                        <span class="ml-3">系统设置</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm z-10">
                <div class="flex justify-between items-center h-16 px-6">
                    <div class="flex items-center">
                        <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fa fa-bell text-xl"></i>
                                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500"></span>
                            </button>
                        </div>
                        <div class="relative">
                            <button type="button" class="flex items-center text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md px-3 py-2">
                                <i class="fa fa-user-circle text-lg mr-2"></i>
                                <span>管理员</span>
                                <i class="fa fa-caret-down ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <h2 class="text-2xl font-bold text-dark mb-6">数据分析</h2>

                <!-- 时间筛选 -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-wrap items-center gap-4">
                        <span class="text-sm font-medium text-gray-700">时间范围：</span>
                        <button class="px-3 py-1 rounded-full bg-primary text-white text-sm">今日</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">本周</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">本月</button>
                        <button class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">自定义</button>
                    </div>
                </div>

                <!-- 数据概览 -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">总预约数</p>
                                <h3 class="text-2xl font-bold text-dark mt-1">128</h3>
                            </div>
                            <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center">
                                <i class="fa fa-calendar text-primary text-xl"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">总维修数</p>
                                <h3 class="text-2xl font-bold text-dark mt-1">96</h3>
                            </div>
                            <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                                <i class="fa fa-wrench text-secondary text-xl"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">总客户数</p>
                                <h3 class="text-2xl font-bold text-dark mt-1">256</h3>
                            </div>
                            <div class="w-12 h-12 bg-success/10 rounded-full flex items-center justify-center">
                                <i class="fa fa-users text-success text-xl"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">总收入</p>
                                <h3 class="text-2xl font-bold text-dark mt-1">¥128,500</h3>
                            </div>
                            <div class="w-12 h-12 bg-danger/10 rounded-full flex items-center justify-center">
                                <i class="fa fa-money text-danger text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-medium text-dark mb-4">预约趋势</h3>
                        <div class="h-64">
                            <!-- 这里可以放置图表 -->
                            <div class="flex items-center justify-center h-full">
                                <p class="text-gray-500">预约趋势图表</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-medium text-dark mb-4">维修类型分布</h3>
                        <div class="h-64">
                            <!-- 这里可以放置图表 -->
                            <div class="flex items-center justify-center h-full">
                                <p class="text-gray-500">维修类型分布图表</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 热门服务 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-medium text-dark mb-4">热门服务</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">服务名称</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">服务次数</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总收入</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">占比</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">常规保养</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">48</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">¥28,800</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">22.4%</td>
                                </tr>
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">故障维修</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">32</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">¥41,600</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">32.4%</td>
                                </tr>
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">车辆检测</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">16</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">¥6,400</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">5.0%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 时间筛选按钮点击事件
        document.querySelectorAll('button[class*="rounded-full"]').forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有按钮的选中状态
                document.querySelectorAll('button[class*="rounded-full"]').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                });
                // 设置当前按钮为选中状态
                this.classList.remove('bg-gray-200', 'text-gray-700');
                this.classList.add('bg-primary', 'text-white');
                // 模拟筛选效果
                alert('筛选时间：' + this.textContent.trim());
            });
        });
    </script>
</body>
</html>
