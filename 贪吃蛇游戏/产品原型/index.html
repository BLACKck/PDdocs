<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 主菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-container {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-logo {
            font-size: 80px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .game-title {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-btn {
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .btn-play {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            font-size: 20px;
            padding: 25px 40px;
        }

        .btn-difficulty {
            background: linear-gradient(135deg, #FF9800, #f57c00);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-records {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-settings {
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
            color: white;
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.3);
        }

        .btn-about {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 5px 15px rgba(96, 125, 139, 0.3);
        }

        .btn-icon {
            font-size: 24px;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stats-title {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
        }

        .high-score .stat-value {
            color: #FFC107;
        }

        .version-info {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #0f3460, #16213e);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
        }

        .modal-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .modal-btn.cancel {
            background: linear-gradient(135deg, #607D8B, #455A64);
        }

        .records-list {
            list-style: none;
            padding: 0;
        }

        .record-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-rank {
            font-weight: bold;
            color: #FFC107;
            margin-right: 10px;
        }

        .record-score {
            font-weight: bold;
            color: #4CAF50;
        }

        .record-date {
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .menu-container {
                padding: 30px 20px;
            }

            .game-logo {
                font-size: 60px;
            }

            .game-title {
                font-size: 36px;
            }

            .menu-btn {
                padding: 18px 30px;
                font-size: 16px;
            }

            .btn-play {
                font-size: 18px;
                padding: 22px 30px;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="game-logo">🐍</div>
        <h1 class="game-title">贪吃蛇游戏</h1>
        <p class="game-subtitle">经典休闲游戏 · 挑战自我极限</p>

        <div class="stats-panel">
            <div class="stats-title">📊 游戏统计</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">游戏次数</div>
                </div>
                <div class="stat-item high-score">
                    <div class="stat-value" id="highScore">0</div>
                    <div class="stat-label">最高分数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label">累计得分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="playTime">0h</div>
                    <div class="stat-label">游戏时长</div>
                </div>
            </div>
        </div>

        <div class="menu-options">
            <button class="menu-btn btn-play" onclick="startGame()">
                <span class="btn-icon">▶️</span>
                开始游戏
            </button>
            <button class="menu-btn btn-difficulty" onclick="selectDifficulty()">
                <span class="btn-icon">⚙️</span>
                选择难度
            </button>
            <button class="menu-btn btn-records" onclick="viewRecords()">
                <span class="btn-icon">🏆</span>
                查看记录
            </button>
            <button class="menu-btn btn-settings" onclick="openSettings()">
                <span class="btn-icon">🔧</span>
                游戏设置
            </button>
            <button class="menu-btn btn-about" onclick="showAbout()">
                <span class="btn-icon">ℹ️</span>
                关于游戏
            </button>
        </div>

        <div class="version-info">版本 1.0.0 | © 2026 贪吃蛇游戏</div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        function startGame() {
            window.location.href = 'game.html';
        }

        function selectDifficulty() {
            window.location.href = 'difficulty.html';
        }

        function viewRecords() {
            window.location.href = 'records.html';
        }

        function openSettings() {
            window.location.href = 'settings.html';
        }

        function showAbout() {
            const aboutContent = `
                <h3>🐍 关于贪吃蛇游戏</h3>
                <p>贪吃蛇是一款经典的休闲益智游戏，起源于1976年的街机游戏《Blockade》。</p>
                <br>
                <p><strong>游戏特色：</strong></p>
                <ul>
                    <li>经典玩法，简单易上手</li>
                    <li>多种难度，满足不同玩家</li>
                    <li>成绩记录，挑战自我极限</li>
                    <li>响应式设计，适配多设备</li>
                    <li>无广告干扰，纯净体验</li>
                </ul>
                <br>
                <p><strong>版本：</strong>1.0.0</p>
                <p><strong>开发者：</strong>贪吃蛇游戏团队</p>
                <p><strong>版权所有：</strong>© 2026</p>
            `;
            showModal('ℹ️ 关于游戏', aboutContent);
        }

        function showModal(title, content) {
            document.getElementById('modalTitle').innerHTML = title;
            document.getElementById('modalMessage').innerHTML = content;
            document.getElementById('infoModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('show');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function loadStats() {
            document.getElementById('totalGames').textContent = '25';
            document.getElementById('highScore').textContent = '520';
            document.getElementById('totalScore').textContent = '3,250';
            document.getElementById('playTime').textContent = '5.2h';
        }

        loadStats();
    </script>
</body>
</html>
